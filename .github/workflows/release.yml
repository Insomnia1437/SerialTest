name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish-release:
    needs: [build]
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Determine Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.tag_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Download Windows Artifact
        uses: actions/download-artifact@v6
        with:
          name: SerialTest-Windows-x64
          path: .
          merge-multiple: true

      - name: Download macOS Artifact
        uses: actions/download-artifact@v6
        with:
          name: SerialTest-macOS-arm64
          path: .
          merge-multiple: true

      - name: Download Linux Artifact
        uses: actions/download-artifact@v6
        with:
          name: SerialTest-Ubuntu-24.04-x86_64
          path: .
          merge-multiple: true

      - name: Rename artifacts with version suffix
        run: |
          mv SerialTest-Windows-x64.zip SerialTest-Windows-x64-${{ env.RELEASE_TAG }}.zip
          mv SerialTest-macOS-arm64.dmg SerialTest-macOS-arm64-${{ env.RELEASE_TAG }}.dmg
          mv SerialTest-Ubuntu-24.04-x86_64.tar.gz SerialTest-Ubuntu-24.04-x86_64-${{ env.RELEASE_TAG }}.tar.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            SerialTest-Windows-x64-${{ env.RELEASE_TAG }}.zip
            SerialTest-macOS-arm64-${{ env.RELEASE_TAG }}.dmg
            SerialTest-Ubuntu-24.04-x86_64-${{ env.RELEASE_TAG }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
