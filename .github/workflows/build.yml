name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  QT_VERSION: '6.11.1'
  AQT_INSTALL_COMMIT: '8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqt and query Qt
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@${{ env.AQT_INSTALL_COMMIT }}"
          python --version
          python -m aqt version
          python -m aqt list-qt windows desktop --arch ${{ env.QT_VERSION }}
          python -m aqt list-qt windows desktop --modules ${{ env.QT_VERSION }} win64_msvc2022_64

      - name: Install Qt
        shell: pwsh
        run: |
          $qtDir = "C:\Qt"
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2022_64 `
            --outputdir $qtDir `
            --modules qt5compat qtserialport qtconnectivity
          $qtBin = "$qtDir\${{ env.QT_VERSION }}\msvc2022_64\bin"
          echo "$qtBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "Qt6_DIR=$qtDir\${{ env.QT_VERSION }}\msvc2022_64\lib\cmake\Qt6" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "QT_ROOT_DIR=$qtDir\${{ env.QT_VERSION }}\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Visual Studio shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Log toolchain info
        shell: cmd
        run: |
          qmake -v
          cl
          windeployqt --version 2>nul || ver

      - name: Build
        shell: cmd
        run: |
          mkdir build\ci
          cd build\ci
          qmake ..\..\src\SerialTest.pro CONFIG+=release CONFIG-=debug_and_release "DEFINES+=_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          nmake /nologo

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "build\ci" -Filter "SerialTest.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) {
            Write-Error "SerialTest.exe not found under build/ci"
            exit 1
          }
          $pkgDir = "package\windows"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item -Path $exe -Destination "$pkgDir\SerialTest.exe"
          windeployqt --release "$pkgDir\SerialTest.exe"
          Copy-Item -Path "README.md" -Destination $pkgDir
          Copy-Item -Path "LICENSE.MIT" -Destination $pkgDir
          Copy-Item -Path "LICENSE.GPL" -Destination $pkgDir
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "SerialTest-Windows-x64.zip"

      - name: Smoke check packaged application
        shell: pwsh
        run: |
          $testDir = "test-pkg"
          Expand-Archive -Path "SerialTest-Windows-x64.zip" -DestinationPath $testDir
          $proc = Start-Process -FilePath "$testDir\SerialTest.exe" -ArgumentList "--config-path $testDir\test_pref.ini" -PassThru
          Start-Sleep -Seconds 3
          if ($proc.HasExited) {
            Write-Error "SerialTest.exe exited prematurely with code $($proc.ExitCode)"
            exit 1
          }
          Stop-Process -Id $proc.Id -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SerialTest-Windows-x64
          path: SerialTest-Windows-x64.zip
          retention-days: 7
          if-no-files-found: error

  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqt and query Qt
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@${{ env.AQT_INSTALL_COMMIT }}"
          python --version
          python -m aqt version
          python -m aqt list-qt mac desktop --arch ${{ env.QT_VERSION }}
          python -m aqt list-qt mac desktop --modules ${{ env.QT_VERSION }} clang_64

      - name: Install Qt
        run: |
          QT_DIR="$HOME/Qt"
          python -m aqt install-qt mac desktop ${{ env.QT_VERSION }} clang_64 \
            --outputdir "$QT_DIR" \
            --modules qt5compat qtserialport qtconnectivity
          QT_BIN="$QT_DIR/${{ env.QT_VERSION }}/macos/bin"
          echo "$QT_BIN" >> $GITHUB_PATH
          echo "Qt6_DIR=$QT_DIR/${{ env.QT_VERSION }}/macos/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "QT_ROOT_DIR=$QT_DIR/${{ env.QT_VERSION }}/macos" >> $GITHUB_ENV

      - name: Log toolchain info
        run: |
          qmake -v
          clang --version
          uname -m

      - name: Build
        run: |
          mkdir -p build/ci
          cd build/ci
          qmake ../../src/SerialTest.pro CONFIG+=release CONFIG+=app_bundle QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j2

      - name: Package
        run: |
          cp README.md LICENSE.MIT LICENSE.GPL build/ci/SerialTest.app/Contents/Resources/
          macdeployqt build/ci/SerialTest.app -dmg
          mv build/ci/SerialTest.dmg ./SerialTest-macOS-arm64.dmg

      - name: Smoke check packaged application
        run: |
          hdiutil attach SerialTest-macOS-arm64.dmg -mountpoint /Volumes/SerialTestMount
          /Volumes/SerialTestMount/SerialTest.app/Contents/MacOS/SerialTest --config-path "$HOME/test_pref.ini" &
          APP_PID=$!
          sleep 3
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "SerialTest crashed or exited prematurely"
            hdiutil detach /Volumes/SerialTestMount || true
            exit 1
          fi
          kill -9 $APP_PID 2>/dev/null || true
          hdiutil detach /Volumes/SerialTestMount

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SerialTest-macOS-arm64
          path: ./SerialTest-macOS-arm64.dmg
          retention-days: 7
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev \
            xvfb fonts-noto-cjk libx11-xcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqt and query Qt
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "git+https://github.com/miurahr/aqtinstall.git@${{ env.AQT_INSTALL_COMMIT }}"
          python --version
          python -m aqt version
          python -m aqt list-qt linux desktop --arch ${{ env.QT_VERSION }}
          python -m aqt list-qt linux desktop --modules ${{ env.QT_VERSION }} linux_gcc_64

      - name: Install Qt
        run: |
          QT_DIR="$HOME/Qt"
          python -m aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 \
            --outputdir "$QT_DIR" \
            --modules qt5compat qtserialport qtconnectivity
          QT_BIN=$(find "$QT_DIR/${{ env.QT_VERSION }}" -maxdepth 2 -type d -name "bin" | head -n 1)
          QT_ROOT=$(dirname "$QT_BIN")
          echo "$QT_BIN" >> $GITHUB_PATH
          echo "Qt6_DIR=$QT_ROOT/lib/cmake/Qt6" >> $GITHUB_ENV
          echo "QT_ROOT_DIR=$QT_ROOT" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$QT_ROOT/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Log toolchain info
        run: |
          qmake -v
          gcc --version
          uname -m

      - name: Compile translations
        run: |
          lrelease src/SerialTest.pro

      - name: Build
        run: |
          mkdir -p build/ci
          cd build/ci
          qmake ../../src/SerialTest.pro CONFIG+=release
          make -j2

      - name: Package
        run: |
          mkdir -p package/linux/SerialTest
          cp build/ci/SerialTest package/linux/SerialTest/
          cp README.md LICENSE.MIT LICENSE.GPL package/linux/SerialTest/
          tar -czf SerialTest-Ubuntu-24.04-x86_64.tar.gz -C package/linux SerialTest

      - name: Smoke check packaged application
        run: |
          tar -xzf SerialTest-Ubuntu-24.04-x86_64.tar.gz -C /tmp/
          touch /tmp/test_pref.ini
          xvfb-run -a /tmp/SerialTest/SerialTest --config-path /tmp/test_pref.ini &
          APP_PID=$!
          sleep 3
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo "SerialTest package crashed or exited prematurely"
            exit 1
          fi
          kill -9 $APP_PID 2>/dev/null || true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: SerialTest-Ubuntu-24.04-x86_64
          path: ./SerialTest-Ubuntu-24.04-x86_64.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Build UI Smoke Test
        run: |
          mkdir -p build/ui-smoke
          cd build/ui-smoke
          qmake ../../src/SerialTest.pro CONFIG+=release CONFIG+=ui_smoke
          make -j2

      - name: Run UI Smoke Test and Capture Screenshots
        run: |
          mkdir -p ui-screenshots
          xvfb-run -a ./build/ui-smoke/SerialTest --theme="(none)" --lang="en" --screenshot-dir="ui-screenshots"
          xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_light" --lang="en" --screenshot-dir="ui-screenshots"
          xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_dark" --lang="en" --screenshot-dir="ui-screenshots"
          xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_light" --lang="zh_CN" --screenshot-dir="ui-screenshots"
          xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_light" --lang="zh_CN" --width=1000 --height=700 --font-size=12 --prefix="1000x700_zh_CN_light_12pt" --screenshot-dir="ui-screenshots"
          QT_SCALE_FACTOR=1.5 xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_dark" --lang="en" --font-size=14 --prefix="scale1.5_en_dark_14pt" --screenshot-dir="ui-screenshots"
          QT_SCALE_FACTOR=2.0 xvfb-run -a ./build/ui-smoke/SerialTest --theme="qdss_dark" --lang="en" --font-size=14 --prefix="scale2.0_en_dark_14pt" --screenshot-dir="ui-screenshots"

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-screenshots
          path: ui-screenshots/
          retention-days: 7
          if-no-files-found: error

      - name: Upload Compiled Translations
        uses: actions/upload-artifact@v6
        with:
          name: qm-translations
          path: src/i18n/*.qm
          retention-days: 7
